name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create Release'
        required: true
        default: false
        type: boolean

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CREATE_RELEASE: ${{ github.repository_owner == 'OneDragon-Anything' && ((github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')) }}
  # vgamepad 安装时默认会弹出 ViGEmBus 驱动安装程序，CI 中跳过，避免卡住
  VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'

jobs:
  version:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build') }}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get version
      id: get_version
      shell: pwsh
      run: python tools/ci/get_version.py

  build:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build') }}
    runs-on: windows-latest
    needs: version

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://astral.sh/uv/install.ps1 | Invoke-Expression

    - name: Create and activate virtual environment
      shell: pwsh
      run: |
        uv venv .venv --python=3.11.12

    - name: Install dependencies
      shell: pwsh
      run: |
        .\.venv\Scripts\Activate.ps1
        uv sync --group dev

    - name: Build executables (PyInstaller)
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
      run: |
        echo "__version__ = '$env:RELEASE_VERSION'" | Out-File -FilePath src/one_dragon/version.py -Encoding utf8
        .\.venv\Scripts\Activate.ps1
        cd deploy
        uv run pyinstaller --noconfirm --clean "OneDragon-Portable.spec"

    - name: Install Velopack CLI
      shell: pwsh
      run: |
        dotnet tool install -g vpk

    - name: Pack with Velopack
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
        CREATE_RELEASE: ${{ env.CREATE_RELEASE }}
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        SIGNPATH_PROJECT_SLUG: 'ZenlessZoneZero-OneDragon'
        SIGNPATH_SIGNING_POLICY_SLUG: 'release-signing'
      run: |
        $semver = $env:RELEASE_VERSION.TrimStart('v')
        $releasesDir = "deploy\dist\releases"
        New-Item -ItemType Directory -Path $releasesDir -Force

        if ($env:CREATE_RELEASE -eq 'true') {
          Install-Module -Name SignPath -Scope CurrentUser -Force -Repository PSGallery -ErrorAction SilentlyContinue
          vpk pack `
            --packId "ZenlessZoneZero-OneDragon" `
            --packVersion "$semver" `
            --packDir "deploy\dist\OneDragon" `
            --mainExe "OneDragon.exe" `
            --icon "assets\ui\logo.ico" `
            --runtime win-x64 `
            --packTitle "ZenlessZoneZero-OneDragon" `
            --packAuthors "OneDragon-Anything" `
            --signTemplate 'pwsh -File tools/ci/sign_file.ps1 "{{file}}"' `
            --outputDir $releasesDir
        } else {
          vpk pack `
            --packId "ZenlessZoneZero-OneDragon" `
            --packVersion "$semver" `
            --packDir "deploy\dist\OneDragon" `
            --mainExe "OneDragon.exe" `
            --icon "assets\ui\logo.ico" `
            --runtime win-x64 `
            --packTitle "ZenlessZoneZero-OneDragon" `
            --packAuthors "OneDragon-Anything" `
            --outputDir $releasesDir
        }

    - name: Build offline models package
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ needs.version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python tools/ci/prepare_release_assets.py --release-version "$env:RELEASE_VERSION" --output-dir "deploy/dist/releases"

    - name: Upload Velopack Artifacts (Non-Release)
      if: ${{ env.CREATE_RELEASE == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: Velopack-Artifacts
        path: deploy/dist/releases/*

    - name: Upload Releases Artifact (Release)
      if: ${{ env.CREATE_RELEASE == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: releases
        path: deploy/dist/releases/*

  sign:
    runs-on: windows-latest
    needs:
      - version
      - build
    if: ${{ env.CREATE_RELEASE == 'true' && needs.build.result == 'success' }}
    steps:
      - name: Download releases
        uses: actions/download-artifact@v4
        with:
          name: releases
          path: deploy/dist/releases

      - name: Verify authenticode signatures
        shell: pwsh
        run: |
          $releasesDir = "deploy\dist\releases"
          $setupExe = Join-Path $releasesDir "ZenlessZoneZero-OneDragon-Setup.exe"
          $portableZip = Join-Path $releasesDir "ZenlessZoneZero-OneDragon-win-Portable.zip"

          if (-not (Test-Path $setupExe)) {
              throw "Setup.exe not found at $setupExe"
          }
          if (-not (Test-Path $portableZip)) {
              throw "Portable.zip not found at $portableZip"
          }

          # 1. 解压 Portable.zip 并检索所有 OneDragon.exe 与 Update.exe
          $tempExtract = Join-Path $env:RUNNER_TEMP "portable_check"
          if (Test-Path $tempExtract) { Remove-Item -Path $tempExtract -Recurse -Force }
          Expand-Archive -Path $portableZip -DestinationPath $tempExtract -Force

          $portableExes = Get-ChildItem -Path $tempExtract -Recurse -File | Where-Object { $_.Name -in @("OneDragon.exe", "Update.exe") } | Select-Object -ExpandProperty FullName
          Write-Host "Found $($portableExes.Count) target executables inside Portable.zip:"
          $portableExes | ForEach-Object { Write-Host "  - $_" }

          $portableOneDragonCount = ($portableExes | Where-Object { $_ -like "*OneDragon.exe" }).Count
          $portableUpdateCount = ($portableExes | Where-Object { $_ -like "*Update.exe" }).Count
          if ($portableOneDragonCount -lt 1) {
              throw "No OneDragon.exe found inside $portableZip"
          }
          if ($portableUpdateCount -lt 1) {
              throw "No Update.exe found inside $portableZip"
          }

          # 2. 解压 *-full.nupkg 并检索包内所有 OneDragon.exe 与 Update.exe
          $fullNupkgs = Get-ChildItem -Path $releasesDir -Filter "*-full.nupkg"
          if ($fullNupkgs.Count -eq 0) {
              throw "No *-full.nupkg package found in $releasesDir"
          }

          $nupkgExes = @()
          foreach ($nupkg in $fullNupkgs) {
              $nupkgExtract = Join-Path $env:RUNNER_TEMP ("nupkg_" + $nupkg.BaseName)
              if (Test-Path $nupkgExtract) { Remove-Item -Path $nupkgExtract -Recurse -Force }
              Expand-Archive -Path $nupkg.FullName -DestinationPath $nupkgExtract -Force

              $matched = Get-ChildItem -Path $nupkgExtract -Recurse -File | Where-Object { $_.Name -in @("OneDragon.exe", "Update.exe") } | Select-Object -ExpandProperty FullName
              Write-Host "Found $($matched.Count) target executables inside $($nupkg.Name):"
              $matched | ForEach-Object { Write-Host "  - $_" }

              if (($matched | Where-Object { $_ -like "*OneDragon.exe" }).Count -lt 1) {
                  throw "No OneDragon.exe found inside $($nupkg.Name)"
              }
              $nupkgExes += $matched
          }

          # 3. 汇总所有待验证目标并逐一执行 Authenticode 校验
          $allTargets = @($setupExe) + $portableExes + $nupkgExes
          Write-Host "`nTotal $($allTargets.Count) binary targets to verify for Authenticode signature:"
          $allTargets | ForEach-Object { Write-Host "  - $_" }

          $failed = $false
          foreach ($target in $allTargets) {
              $sig = Get-AuthenticodeSignature -FilePath $target
              Write-Host "Authenticode check [$target]: Status=$($sig.Status), Subject=$($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') {
                  Write-Error "Signature validation FAILED for $target. Expected 'Valid', got '$($sig.Status)'."
                  $failed = $true
              }
          }

          if ($failed) {
              Write-Error "One or more release executables are not signed with a Valid Authenticode signature."
              exit 1
          }

          Write-Host "`nAll release executables across Setup.exe, Portable.zip, and full.nupkg verified successfully."

  release:
    runs-on: windows-latest
    needs:
      - version
      - build
      - sign
    if: ${{ env.CREATE_RELEASE == 'true' && needs.build.result == 'success' && needs.sign.result == 'success' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download releases
      uses: actions/download-artifact@v4
      with:
        name: releases
        path: deploy/dist/releases

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ startsWith(needs.version.outputs.version, 'v') && needs.version.outputs.version || format('v{0}', needs.version.outputs.version) }}
        name: "Release ${{ needs.version.outputs.version }}"
        body: |
          > 中国大陆用户推荐前往 [CNB（Cloud Native Build）](https://cnb.cool/OneDragon-Anything/ZenlessZoneZero-OneDragon) 下载，速度更快。

          ## 安装方式

          - `ZenlessZoneZero-OneDragon-Setup.exe`：安装程序，解压安装并自带自动升级。
          - `ZenlessZoneZero-OneDragon-win-Portable.zip`：便携版压缩包，解压即用、自带自动升级。
          - `ZenlessZoneZero-OneDragon-Models.zip`：离线模型包，解压到根目录 `assets/models/` 即可离线使用。

          安装前请查看 [安装指南](https://one-dragon.com/zzz/zh/quickstart.html)
          若运行出错请查看 [自助排障指南](https://docs.qq.com/doc/p/7add96a4600d363b75d2df83bb2635a7c6a969b5)

          已有 Mirror酱 CDK？前往 [Mirror酱](https://mirrorchyan.com/zh/projects?rid=ZZZ-OneDragon&source=zzzgh-release) 高速下载

          ## 签名策略 (Code Signing Policy)

          免费代码签名由 [SignPath.io](https://signpath.io/) 提供，证书由 [SignPath Foundation](https://signpath.org/) 颁发

          审批人：[DoctorReid](https://github.com/DoctorReid) [ShadowLemoon](https://github.com/ShadowLemoon)

          Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)

          Approvers: [DoctorReid](https://github.com/DoctorReid) [ShadowLemoon](https://github.com/ShadowLemoon)

          ## 隐私政策 (Privacy Policy)

          本程序的隐私政策详见：[隐私政策](.github/PRIVACY.md)。

          See the [Privacy Policy](.github/PRIVACY.md).

        files: |
          deploy/dist/releases/*
        generate_release_notes: false
        prerelease: ${{ contains(needs.version.outputs.version, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Trigger CNB Release sync
      if: ${{ github.repository == 'OneDragon-Anything/ZenlessZoneZero-OneDragon' }}
      continue-on-error: true
      shell: pwsh
      env:
        CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        RELEASE_TAG: ${{ startsWith(needs.version.outputs.version, 'v') && needs.version.outputs.version || format('v{0}', needs.version.outputs.version) }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) {
          throw 'Missing GitHub Actions secret: CNB_TOKEN'
        }

        $headers = @{
          Accept = 'application/vnd.cnb.api+json'
          Authorization = "Bearer $env:CNB_TOKEN"
        }
        $body = @{
          branch = 'main'
          event = 'api_trigger_release'
          title = "Sync GitHub Release $env:RELEASE_TAG"
          env = @{
            RELEASE_TAG = $env:RELEASE_TAG
          }
        } | ConvertTo-Json -Depth 3

        $response = Invoke-RestMethod `
          -Uri 'https://api.cnb.cool/OneDragon-Anything/ZenlessZoneZero-OneDragon/-/build/start' `
          -Method Post `
          -Headers $headers `
          -ContentType 'application/json' `
          -TimeoutSec 60 `
          -Body $body
        $response | ConvertTo-Json -Depth 5
        if ($response.success -ne $true) {
          throw "CNB build trigger failed: $($response.message)"
        }
