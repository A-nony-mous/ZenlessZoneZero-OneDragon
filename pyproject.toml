[project]
name = "ZenlessZoneZero-OneDragon"
version = "2.0.0"
description = "Zenless Zone Zero OneDragon | Auto Daily | Auto Hollow | Gamepad Support"
requires-python = "==3.11.*"
dependencies = [
    "pyside6==6.8.0.2",
    "pyside6-fluent-widgets==1.7.0",
    "pyyaml==6.0.1",
    "opencv-python==4.10.0.84",
    "pyautogui==0.9.54",
    "pynput==1.7.7",
    "onnxruntime-directml==1.18.0",
    "mss==9.0.1",
    "shapely==2.0.4",
    "pyclipper==1.3.0.post5",
    "soundcard==0.4.3",
    "librosa==0.10.2.post1",
    "gensim==4.3.3",
    "pygit2==1.19.0",
]

[dependency-groups]
dev = [
    "colorama==0.4.6",
    "matplotlib==3.10.3",
    "polib==1.2.0",
    "pyinstaller==6.7.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.10",
    "pyuac==0.0.3",
]

gamepad = [
    "vgamepad==0.1.0",
]

[tool.uv]
package = false
cache-dir = "./.install/uv_cache"
environments = ["sys_platform == 'win32'"]
default-groups = []

# Ruff configuration
[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # mccabe
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "TID",    # tidy imports
]
ignore = ["RUF001", "RUF003"]
extend-ignore = [
    "E501",   # line too long - already handled by black style
    "C901",   # method too complex - need refactor
    "SIM102", # nested if statements - maybe more clear to seperate conditions
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"



# Briefcase configuration
[tool.briefcase]
project_name = "ZenlessZoneZero-OneDragon"
bundle = "com.one-dragon.zzz"
version = "2.0.0"
url = "https://zzz.one-dragon.com"
license.file = "LICENSE"
author = "OneDragon Team"
author_email = "one-dragon@example.com"
icon = "src/zzz_od/resources/zzz_od"

[tool.briefcase.app.zzz_od]
formal_name = "ZenlessZoneZero-OneDragon"

sources = [
    "src/zzz_od",
    "src/one_dragon",
    "src/one_dragon_qt",
    "src/onnxocr",
    "assets",
    "config",
]
icon = "src/zzz_od/resources/zzz_od"
test_sources = [
    "tests",
]

